server:
  port: 8083
spring:
  application:
    name: order-service
  datasource:
    url: '${DB_URL:jdbc:h2:mem:orders;MODE=MySQL;DB_CLOSE_DELAY=-1}'
    driver-class-name: '${DB_DRIVER:org.h2.Driver}'
    username: '${DB_USER:sa}'
    password: '${DB_PASS:}'
  sql:
    init:
      encoding: UTF-8
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
eureka:
  client:
    service-url:
      defaultZone: '${EUREKA_URL:http://localhost:8761/eureka/}'
