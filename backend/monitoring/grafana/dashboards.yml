# Grafana 仪表盘自动 provisioning：加载 dashboards 目录下的 JSON
apiVersion: 1

providers:
  - name: erp-dashboards
    orgId: 1
    folder: ERP
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
