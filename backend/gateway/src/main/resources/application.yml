server:
  port: 8081
spring:
  application:
    name: gateway-service
  config:
    import: 'optional:nacos:${spring.application.name}.yml'
  autoconfigure:
    exclude: 'com.alibaba.cloud.sentinel.SentinelWebFluxAutoConfiguration'
  cloud:
    discovery:
      client:
        simple:
          instances:
            gateway:
              - uri: '${STATIC_GATEWAY_URL:http://localhost:8081}'
            catalog-service:
              - uri: '${STATIC_CATALOG_SERVICE_URL:http://localhost:8082}'
            order-service:
              - uri: '${STATIC_ORDER_SERVICE_URL:http://localhost:8083}'
            inventory-service:
              - uri: '${STATIC_INVENTORY_SERVICE_URL:http://localhost:8084}'
            report-service:
              - uri: '${STATIC_REPORT_SERVICE_URL:http://localhost:8085}'
            auth-service:
              - uri: '${STATIC_AUTH_SERVICE_URL:http://localhost:8086}'
    sentinel:
      transport:
        dashboard: '${SENTINEL_DASHBOARD:localhost:8080}'
        port: '${SENTINEL_TRANSPORT_PORT:8719}'
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: '${NACOS_SERVER_ADDR:localhost:8848}'
            namespace: '${NACOS_NAMESPACE:public}'
            data-id: '${spring.application.name}-flow-rules'
            group-id: SENTINEL_GROUP
            rule-type: flow
        degrade:
          nacos:
            server-addr: '${NACOS_SERVER_ADDR:localhost:8848}'
            namespace: '${NACOS_NAMESPACE:public}'
            data-id: '${spring.application.name}-degrade-rules'
            group-id: SENTINEL_GROUP
            rule-type: degrade
    nacos:
      server-addr: '${NACOS_SERVER_ADDR:localhost:8848}'
      discovery:
        enabled: '${NACOS_DISCOVERY_ENABLED:false}'
        namespace: '${NACOS_NAMESPACE:public}'
        register-enabled: '${NACOS_REGISTER_ENABLED:false}'
        fail-fast: false
      config:
        namespace: '${NACOS_NAMESPACE:public}'
        file-extension: yml
        refresh-enabled: true
        import-check:
          enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: catalog-route
          uri: lb://catalog-service
          predicates:
            - Path=/api/suppliers/**,/api/parts/**,/api/quotes/**,/api/performance/**
        - id: order-route
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**,/api/requisitions/**,/api/receives/**,/api/outbox/**
        - id: inventory-route
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
        - id: report-route
          uri: lb://report-service
          predicates:
            - Path=/api/reports/**
        - id: auth-route
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
erp:
  security:
    enabled: '${ERP_SECURITY_ENABLED:true}'
  jwt:
    secret: '${ERP_JWT_SECRET:erp-cloud-dev-jwt-secret-change-me-32bytes}'
  ratelimit:
    capacity: 30
    refill-per-second: 10
  cache:
    type: local
management:
  health:
    nacos-discovery:
      enabled: false
    nacos-config:
      enabled: false
    redis:
      enabled: false
    discoveryComposite:
      enabled: false
    reactiveDiscoveryClients:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: '${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}'
  metrics:
    tags:
      application: '${spring.application.name}'
resilience4j:
  circuitbreaker:
    instances:
      erpBackend:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 5
