server:
  port: 8081
spring:
  application:
    name: gateway-service
  config:
    import: 'optional:nacos:${spring.application.name}.yml'
  autoconfigure:
    exclude: ''
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      server-addr: '${NACOS_SERVER_ADDR:localhost:8848}'
      discovery:
        namespace: '${NACOS_NAMESPACE:public}'
        register-enabled: '${NACOS_REGISTER_ENABLED:false}'
        fail-fast: false
      config:
        namespace: '${NACOS_NAMESPACE:public}'
        file-extension: yml
        refresh-enabled: true
        import-check:
          enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: catalog-route
          uri: lb://catalog-service
          predicates:
            - Path=/api/suppliers/**,/api/parts/**,/api/quotes/**,/api/performance/**
        - id: order-route
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**,/api/requisitions/**,/api/receive/**,/api/outbox/**
        - id: inventory-route
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
        - id: auth-route
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
      default-filters:
        - name: CircuitBreaker
          args:
            name: erpBackend
            fallbackUri: forward:/fallback
erp:
  security:
    enabled: '${ERP_SECURITY_ENABLED:true}'
  jwt:
    secret: '${ERP_JWT_SECRET:erp-local-development-secret-key-32bytes-minimum}'
  ratelimit:
    capacity: 30
    refill-per-second: 10
  cache:
    type: local
management:
  health:
    nacos-discovery:
      enabled: false
    nacos-config:
      enabled: false
    redis:
      enabled: false
    discoveryComposite:
      enabled: false
    reactiveDiscoveryClients:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: '${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}'
  metrics:
    tags:
      application: '${spring.application.name}'
resilience4j:
  circuitbreaker:
    instances:
      erpBackend:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 5
