server:
  port: 8081
spring:
  application:
    name: gateway-service
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      server-addr: '${NACOS_SERVER_ADDR:localhost:8848}'
      discovery:
        namespace: '${NACOS_NAMESPACE:public}'
      config:
        namespace: '${NACOS_NAMESPACE:public}'
        file-extension: yml
        refresh-enabled: true
        import-check:
          enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: catalog-route
          uri: lb://catalog-service
          predicates:
            - Path=/api/suppliers/**,/api/parts/**
        - id: order-route
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
        - id: inventory-route
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
        - id: auth-route
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
erp:
  security:
    enabled: '${ERP_SECURITY_ENABLED:true}'
  jwt:
    secret: '${ERP_JWT_SECRET:erp-local-development-secret-key-32bytes-minimum}'
  ratelimit:
    capacity: 30
    refill-per-second: 10
  cache:
    type: local
spring:
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      server-addr: '${NACOS_SERVER_ADDR:localhost:8848}'
      discovery:
        namespace: '${NACOS_NAMESPACE:public}'
      config:
        namespace: '${NACOS_NAMESPACE:public}'
        file-extension: yml
        refresh-enabled: true
        import-check:
          enabled: false
    gateway:
      default-filters:
        - name: CircuitBreaker
          args:
            name: erpBackend
            fallbackUri: forward:/fallback

management:
  health:
    nacos-discovery:
      enabled: false
    nacos-config:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: '${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}'
  metrics:
    tags:
      application: '${spring.application.name}'
