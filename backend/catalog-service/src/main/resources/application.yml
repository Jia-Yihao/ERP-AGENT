server:
  port: 8082
spring:
  application:
    name: catalog-service

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
    compatibility-verifier:
    discovery:
      client:
        simple:
          instances:
            gateway:
              - uri: '${STATIC_GATEWAY_URL:http://localhost:8081}'
            catalog-service:
              - uri: '${STATIC_CATALOG_SERVICE_URL:http://localhost:8082}'
            order-service:
              - uri: '${STATIC_ORDER_SERVICE_URL:http://localhost:8083}'
            inventory-service:
              - uri: '${STATIC_INVENTORY_SERVICE_URL:http://localhost:8084}'
            report-service:
              - uri: '${STATIC_REPORT_SERVICE_URL:http://localhost:8085}'
            auth-service:
              - uri: '${STATIC_AUTH_SERVICE_URL:http://localhost:8086}'
    sentinel:
      transport:
        dashboard: '${SENTINEL_DASHBOARD:localhost:8080}'
        port: 8719
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: '${NACOS_SERVER_ADDR:localhost:8848}'
            namespace: '${NACOS_NAMESPACE:public}'
            data-id: '${spring.application.name}-flow-rules'
            group-id: SENTINEL_GROUP
            rule-type: flow
        degrade:
          nacos:
            server-addr: '${NACOS_SERVER_ADDR:localhost:8848}'
            namespace: '${NACOS_NAMESPACE:public}'
            data-id: '${spring.application.name}-degrade-rules'
            group-id: SENTINEL_GROUP
            rule-type: degrade
    nacos:
      server-addr: '${NACOS_SERVER_ADDR:localhost:8848}'
      discovery:
        namespace: '${NACOS_NAMESPACE:public}'
        register-enabled: '${NACOS_REGISTER_ENABLED:false}'
        fail-fast: false
      config:
        namespace: '${NACOS_NAMESPACE:public}'
        file-extension: yml
        refresh-enabled: true
        import-check:
          enabled: false
  config:
    import: 'optional:nacos:${spring.application.name}.yml'
  autoconfigure:
    exclude: '${SPRING_AUTOCONFIGURE_EXCLUDE:org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration}'
  datasource:
    url: '${DB_URL:jdbc:h2:mem:catalog;MODE=MySQL;DB_CLOSE_DELAY=-1}'
    driver-class-name: '${DB_DRIVER:org.h2.Driver}'
    username: '${DB_USER:sa}'
    password: '${DB_PASS:}'
  sql:
    init:
      encoding: UTF-8
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
erp:
  slow-sql:
    threshold-ms: 200

  security:
    enabled: '${ERP_SECURITY_ENABLED:true}'
    permit-all:
      - /actuator/health/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /internal/**
  jwt:
    secret: '${ERP_JWT_SECRET:erp-local-development-secret-key-32bytes-minimum}'
    access-ttl-seconds: 7200
    refresh-ttl-seconds: 604800

management:
  health:
    nacos-discovery:
      enabled: false
    nacos-config:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: '${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}'
  metrics:
    tags:
      application: '${spring.application.name}'
seata:
  enabled: '${SEATA_ENABLED:false}'
  tx-service-group: erp-tx-group
  registry:
    type: nacos
    nacos:
      server-addr: '${NACOS_SERVER_ADDR:localhost:8848}'
      namespace: '${NACOS_NAMESPACE:public}'
      group: SEATA_GROUP
      application: seata-server
  config:
    type: nacos
    nacos:
      server-addr: '${NACOS_SERVER_ADDR:localhost:8848}'
      namespace: '${NACOS_NAMESPACE:public}'
      group: SEATA_GROUP
