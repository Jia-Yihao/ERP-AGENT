spring:
  cloud:
    nacos:
      discovery:
        enabled: true
        register-enabled: true
        server-addr: '${NACOS_SERVER_ADDR:nacos:8848}'
  autoconfigure:
    exclude: '${SPRING_AUTOCONFIGURE_EXCLUDE:org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration,org.springframework.cloud.client.discovery.simple.reactive.SimpleReactiveDiscoveryClientAutoConfiguration}'

erp:
  cache:
    type: '${ERP_CACHE_TYPE:redis}'
