server:
  port: 8085
spring:
  application:
    name: report-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
    compatibility-verifier:
      enabled: false
    nacos:
      server-addr: '${NACOS_SERVER_ADDR:localhost:8848}'
      discovery:
        namespace: '${NACOS_NAMESPACE:public}'
      config:
        namespace: '${NACOS_NAMESPACE:public}'
        file-extension: yml
        refresh-enabled: true
        import-check:
          enabled: false
  config:
    import: 'optional:nacos:${spring.application.name}.yml'
management:
  health:
    nacos-discovery:
      enabled: false
    nacos-config:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
resilience4j:
  circuitbreaker:
    instances:
      reportDownstream:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      reportDownstream:
        maxAttempts: 3
        waitDuration: 200ms
