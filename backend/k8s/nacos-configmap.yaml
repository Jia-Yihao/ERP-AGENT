# 公共服务配置：Nacos 地址、Redis、链路追踪及 JVM 参数
apiVersion: v1
kind: ConfigMap
metadata:
  name: erp-common-config
  namespace: erp-cloud
data:
  SPRING_PROFILES_ACTIVE: docker
  NACOS_SERVER_ADDR: nacos:8848
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
  JAVA_OPTS: -Xms256m -Xmx512m
---
# 数据库连接串（非敏感部分），按服务分键注入
apiVersion: v1
kind: ConfigMap
metadata:
  name: erp-db-config
  namespace: erp-cloud
data:
  DB_DRIVER: com.mysql.cj.jdbc.Driver
  DB_USER: root
  DB_URL_CATALOG: jdbc:mysql://mysql:3306/erp_catalog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  DB_URL_ORDER: jdbc:mysql://mysql:3306/erp_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  DB_URL_INVENTORY: jdbc:mysql://mysql:3306/erp_inventory?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  DB_URL_REPORT: jdbc:mysql://mysql:3306/erp_catalog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
---
# 敏感配置：生产环境应替换为外部 Secret 管理工具注入的值
apiVersion: v1
kind: Secret
metadata:
  name: erp-app-secret
  namespace: erp-cloud
type: Opaque
stringData:
  DB_PASS: "change-me-db-password"
  # HS256 密钥须 >=32 字节；内部调用 HMAC 未配置时一律拒绝
  ERP_JWT_SECRET: "erp-cloud-dev-jwt-secret-change-me-32bytes"
  ERP_INTERNAL_SECRET: "erp-cloud-dev-internal-secret-change-me"
  ERP_MCP_CLIENT_SECRET: "change-me"
