server:
  port: 8086
spring:
  cloud:
    discovery:
      client:
        simple:
          instances:
            gateway:
              - uri: '${STATIC_GATEWAY_URL:http://localhost:8081}'
            catalog-service:
              - uri: '${STATIC_CATALOG_SERVICE_URL:http://localhost:8082}'
            order-service:
              - uri: '${STATIC_ORDER_SERVICE_URL:http://localhost:8083}'
            inventory-service:
              - uri: '${STATIC_INVENTORY_SERVICE_URL:http://localhost:8084}'
            report-service:
              - uri: '${STATIC_REPORT_SERVICE_URL:http://localhost:8085}'
            auth-service:
              - uri: '${STATIC_AUTH_SERVICE_URL:http://localhost:8086}'
    sentinel:
      transport:
        dashboard: '${SENTINEL_DASHBOARD:localhost:8080}'
        port: '${SENTINEL_TRANSPORT_PORT:8719}'
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: '${NACOS_SERVER_ADDR:localhost:8848}'
            namespace: '${NACOS_NAMESPACE:public}'
            data-id: '${spring.application.name}-flow-rules'
            group-id: SENTINEL_GROUP
            rule-type: flow
        degrade:
          nacos:
            server-addr: '${NACOS_SERVER_ADDR:localhost:8848}'
            namespace: '${NACOS_NAMESPACE:public}'
            data-id: '${spring.application.name}-degrade-rules'
            group-id: SENTINEL_GROUP
            rule-type: degrade
    nacos:
      server-addr: '${NACOS_SERVER_ADDR:localhost:8848}'
      discovery:
        enabled: '${NACOS_DISCOVERY_ENABLED:false}'
        namespace: '${NACOS_NAMESPACE:public}'
        register-enabled: '${NACOS_REGISTER_ENABLED:false}'
        fail-fast: false
  config:
    import: 'optional:nacos:${spring.application.name}.yml'
  application:
    name: auth-service
  datasource:
    url: '${DB_URL:jdbc:h2:mem:auth;MODE=MySQL;DB_CLOSE_DELAY=-1}'
    driver-class-name: '${DB_DRIVER:org.h2.Driver}'
    username: '${DB_USER:sa}'
    password: '${DB_PASS:}'
  sql:
    init:
      encoding: UTF-8
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  data:
    redis:
      host: '${REDIS_HOST:localhost}'
      port: '${REDIS_PORT:6379}'
      timeout: 2s
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
erp:
  jwt:
    secret: '${ERP_JWT_SECRET:erp-cloud-dev-jwt-secret-change-me-32bytes}'
    access-ttl-seconds: 7200
    refresh-ttl-seconds: 604800
    issuer: erp-cloud
  security:
    enabled: '${ERP_SECURITY_ENABLED:true}'
    permit-all: /api/auth/login,/api/auth/token,/api/auth/refresh,/actuator/health/**,/v3/api-docs/**,/swagger-ui/**
  mcp:
    client-secret: '${ERP_MCP_CLIENT_SECRET:change-me}'
management:
  health:
    nacos-discovery:
      enabled: false
    nacos-config:
      enabled: false
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
