server:
  port: 8086
spring:
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      server-addr: '${NACOS_SERVER_ADDR:localhost:8848}'
      discovery:
        namespace: '${NACOS_NAMESPACE:public}'
  config:
    import: 'optional:nacos:${spring.application.name}.yml'
  application:
    name: auth-service
  datasource:
    url: '${DB_URL:jdbc:h2:mem:auth;MODE=MySQL;DB_CLOSE_DELAY=-1}'
    driver-class-name: '${DB_DRIVER:org.h2.Driver}'
    username: '${DB_USER:sa}'
    password: '${DB_PASS:}'
  sql:
    init:
      encoding: UTF-8
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  data:
    redis:
      host: '${REDIS_HOST:localhost}'
      port: '${REDIS_PORT:6379}'
      timeout: 2s
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
erp:
  jwt:
    secret: '${ERP_JWT_SECRET:${JWT_SECRET:erp-cloud-dev-jwt-secret-change-me-32bytes}}'
    access-ttl-seconds: 7200
    refresh-ttl-seconds: 604800
    issuer: erp-cloud
  security:
    enabled: '${ERP_SECURITY_ENABLED:true}'
    permit-all: /api/auth/login,/api/auth/token,/api/auth/refresh,/actuator/health/**,/v3/api-docs/**,/swagger-ui/**
  mcp:
    client-secret: '${ERP_MCP_CLIENT_SECRET:change-me}'
